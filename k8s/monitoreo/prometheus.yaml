# Prometheus: base de datos de series temporales (TSDB) + reglas de alerta
# La configuración se carga desde el ConfigMap "prometheus-config"
# (lo crea scripts/setup.sh a partir de monitoring/prometheus/).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoreo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-granja
rules:
  - apiGroups: [""]
    resources: [pods, nodes, nodes/proxy, nodes/metrics, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-granja
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-granja
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoreo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoreo
  labels: { app: prometheus }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits:   { cpu: 400m, memory: 448Mi }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: datos
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: datos
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoreo
  labels: { app: prometheus }
spec:
  selector: { app: prometheus }
  ports:
    - name: http
      port: 9090
      targetPort: http
