# Grafana: tableros de visualización. Datasource y dashboard se aprovisionan
# desde ConfigMaps (los crea scripts/setup.sh a partir de monitoring/grafana/).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoreo
  labels: { app: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/granja-express.json
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests: { cpu: 30m, memory: 96Mi }
            limits:   { cpu: 300m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: proveedores
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: datos
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: proveedores
          configMap: { name: grafana-proveedores }
        - name: dashboards
          configMap: { name: grafana-dashboards }
        - name: datos
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoreo
  labels: { app: grafana }
spec:
  selector: { app: grafana }
  ports:
    - name: http
      port: 3000
      targetPort: http
