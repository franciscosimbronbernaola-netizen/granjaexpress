# Worker asíncrono de tickets + relay del outbox
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: granja
  labels: { app: worker, capa: aplicacion }
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker, capa: aplicacion }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: worker
          image: granja-worker:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 9100
              name: metrics
          envFrom:
            - configMapRef: { name: granja-config }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: granja-secret, key: DATABASE_URL }
            - name: PG_POOL_MAX
              value: "2"
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          resources:
            requests: { cpu: 30m, memory: 80Mi }
            limits:   { cpu: 200m, memory: 160Mi }
          readinessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  namespace: granja
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
