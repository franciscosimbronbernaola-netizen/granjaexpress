# Redis: caché del catálogo + cola de tickets (capa de datos, red privada)
# Sin persistencia a propósito: la fuente de verdad es Supabase (outbox).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: granja
  labels: { app: redis, capa: datos }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis, capa: datos }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru", "--appendonly", "no", "--save", ""]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests: { cpu: 30m, memory: 48Mi }
            limits:   { cpu: 200m, memory: 96Mi }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: datos
              mountPath: /data
      volumes:
        - name: datos
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: granja
  labels: { app: redis }
spec:
  type: ClusterIP
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
