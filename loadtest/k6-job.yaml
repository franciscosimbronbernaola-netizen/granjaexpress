# Ejecuta la prueba de carga DENTRO del clúster (scripts/carga.sh la lanza)
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-carga
  namespace: granja
  labels: { app: k6 }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: k6 }
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.55.0
          args: ["run", "--quiet", "/scripts/carga.js"]
          env:
            - name: BASE_URL
              value: http://frontend.granja.svc.cluster.local
            - name: DURACION
              value: "3"
            - name: VUS
              value: "20"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-script
