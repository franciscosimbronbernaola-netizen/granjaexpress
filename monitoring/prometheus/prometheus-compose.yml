# Prometheus para docker-compose: descubre las réplicas por DNS
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 3000
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
